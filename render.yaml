services:
  - type: web
    name: ak-suu-portal
    runtime: python
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "0"
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
