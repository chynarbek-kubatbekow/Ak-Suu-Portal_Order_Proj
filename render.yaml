services:
  - type: web
    name: ak-suu-portal
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    # SQLite and uploaded images require a persistent disk (paid Render plan).
    plan: starter
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "0"
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_LOCAL_MEDIA
        value: "1"
